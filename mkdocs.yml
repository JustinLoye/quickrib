site_name: QuickRIB
site_description: BGP routing table reconstruction and analysis
site_author: JustinLoye
repo_url: https://github.com/JustinLoye/quickrib
repo_name: quickrib

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
      - Reconstruction: guide/reconstruction.md
      - Observers: guide/observers.md
      - AS Hegemony: guide/hegemony.md
      - IODA Signal: guide/ioda.md
      - BGPlay: guide/bgplay.md
      - Update Classification: guide/update_tagger.md
      - Anomaly Detection: guide/mad.md
  - API Reference:
      - Overview: api/overview.md
      - QuickRIB: api/quickrib.md
      - RIBTable: api/rib_table.md
      - Observers: api/observers.md
      - Utilities: api/utilities.md
  - Performance: performance.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_bases: true
            show_root_heading: true
            heading_level: 2
            show_field_summary: false
            show_docstring_description: true
            members_order: source
            group_by_category: true
            extensions:
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
            - !relative $config_dir
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js

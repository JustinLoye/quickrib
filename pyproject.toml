[project]
name = "quickrib"
version = "0.1.0"
description = "BGP RIB construction, update and analysis"
readme = "README.md"
authors = [
    { name = "Justin Loye", email = "jloye@iij.ad.jp" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bgp", "routing", "rib", "ripe-ris", "routeviews", "internet-measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.2",
    "py-radix>=1.1.0",
    "pybgpflux>=0.5.2",
    "pydantic>=2.12.5",
    "pywavelets>=1.9.0",
]

[project.urls]
Repository = "https://github.com/JustinLoye/quickrib"
Documentation = "https://justinloye.github.io/quickrib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
test = [
    "networkx>=3.6.1",
    "pytest>=9.0.2",
    "requests-cache>=1.3.0",
    # Only to pin `trim_mean` against `scipy.stats.trim_mean`, the reference it
    # replaced; the library itself no longer needs scipy.
    "scipy>=1.17.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
    "griffe-pydantic"
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "examples" },
    "ipython>=9.10.0",
    
]
examples = [
    # Only `parser="pybgpstream"` in the notebooks needs this; the library and
    # the test suite run on the default parsers.
    "pybgpstream>=2.0.2",
    "marimo>=0.23.13",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "polars>=1.42.1",
]

# Ruff is the third check next to `ty` (fast) and `pyright` (authoritative):
# neither type checker reports an unused import, a mutable default, or a loop
# that only reads a dict's values.
[tool.ruff]
line-length = 100
extend-exclude = ["archive", "examples/hegemony.py"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "PERF", "SIM", "UP", "I"]
ignore = [
    # `X | None` and `Optional[X]` are used about equally here; rewriting one
    # into the other is churn, not a fix.
    "UP007",
    "UP045",
    # PEP 695 (`def f[T]()`, `type X = ...`) is standard but not yet the common
    # idiom, and neither pyright nor ty requires it. Rewriting `TypeVar` and
    # `TypeAlias` to it would touch the public type surface for no checkable
    # gain -- the same reason `missing-override-decorator` stays off.
    "UP040",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Vendored, reduced third-party code: checked for real errors, not restyled.
"src/quickrib/observers/_gdecomp.py" = ["B", "PERF", "SIM", "UP"]
# Tests name things after what they assert, and pytest fixtures shadow builtins
# less often than they read well.
"tests/*" = ["B011"]

[tool.ty.environment]
python = ".venv"
# `py-radix` ships no type information; typings/radix.pyi covers what we use.
extra-paths = ["typings"]

[tool.ty.rules]
# Stricter than ty's defaults, but deliberately not "every rule". Notably
# `missing-override-decorator` stays off: the on-by-default `invalid-method-override`
# already catches an override with the wrong signature, so an @override on every
# method would only buy protection against a *misspelled* hook name -- not worth
# the noise. See AGENTS.md.
missing-type-argument = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsound-assignment = "error"

# A marimo notebook: its imports live inside cell functions, so every name is
# opaque to a static checker. Real errors still surface; annotations do not.
[[tool.ty.overrides]]
include = ["examples/hegemony.py"]

[tool.ty.overrides.rules]
unsound-return-statement = "ignore"

# _gdecomp.py is vendored third-party code (a reduced subset of another
# project); it is checked for real errors but not held to our annotation rules.
[[tool.ty.overrides]]
include = ["src/quickrib/observers/_gdecomp.py"]

[tool.ty.overrides.rules]
missing-type-argument = "ignore"
unsound-return-statement = "ignore"

# Pylance/pyright is what the IDE runs, so it is the source of truth. `archive/`
# is pre-rewrite code kept out of the way; it is not checked.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
# examples/hegemony.py is a marimo notebook: its imports live inside cell
# functions, so every name in it is opaque to a static checker.
exclude = ["archive", "examples/hegemony.py", "**/__pycache__", "**/__marimo__"]
stubPath = "typings"
pythonVersion = "3.12"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]
addopts = '-q -rs --strict-markers -m "not e2e"'
markers = [
    "e2e: end-to-end test; downloads real BGP archives and runs the full QuickRIB pipeline (slow, network-bound; deselected by default)",
]
